<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product - Mini Amazon</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <header>

        <div class="navbar">

            <h1>Mini Amazon</h1>

            <nav>

                <a href="/">Store</a>

                <a href="/admin/products">Products</a>

                <a href="/cart">Cart</a>

                <a href="/logout">Logout</a>

            </nav>

        </div>

    </header>


    <main>

        <div class="admin-header">

            <div>

                <h2>Edit Product</h2>

                <p>Update product information</p>

            </div>

            <a href="/admin/products">
                Back to Products
            </a>

        </div>


        <div class="admin-form-card">

            <form method="POST">

                <div class="form-group">

                    <label for="name">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ product.get('name', '') }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        required
                    >{{ product.get('description', '') }}</textarea>

                </div>


                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        value="{{ product.get('price', '') }}"
                        min="0.01"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-actions">

                    <a
                        href="/admin/products"
                        class="secondary-button"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
