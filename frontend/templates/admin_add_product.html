<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product - Mini Amazon</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="site-header">

        <div class="header-container">

            <h1>Mini Amazon</h1>

            <nav>
                <a href="{{ url_for('home') }}">Store</a>
                <a href="{{ url_for('admin_products') }}">Products</a>
                <a href="{{ url_for('view_cart') }}">Cart</a>
            </nav>

        </div>

    </header>


    <main class="admin-container">

        <div class="admin-page-header">

            <div>
                <h2>Add Product</h2>
                <p>Create a new product for Mini Amazon.</p>
            </div>

            <a href="{{ url_for('admin_products') }}"
               class="secondary-button">
                Back to Products
            </a>

        </div>


        <div class="admin-form-card">

            <form method="POST"
                  enctype="multipart/form-data">

                <div class="form-group">

                    <label for="name">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter product name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="5"
                        placeholder="Enter product description"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        min="1"
                        step="0.01"
                        placeholder="Enter product price"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="image">
                        Product Image
                    </label>

                    <input
                        type="file"
                        id="image"
                        name="image"
                        accept="image/*"
                    >

                    <small>
                        Upload a product image.
                    </small>

                </div>


                <div class="form-actions">

                    <a href="{{ url_for('admin_products') }}"
                       class="secondary-button">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="primary-button">
                        Create Product
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
