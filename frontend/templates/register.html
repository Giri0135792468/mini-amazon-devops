<!DOCTYPE html>
<html>
<head>
    <title>Register - Mini Amazon</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="navbar">
        Mini Amazon
    </div>

    <div class="container">

        <h2>Create Account</h2>

        {% if error %}
            <p>{{ error }}</p>
        {% endif %}

        <form method="POST">

            <div>
                <label>Name</label>
                <br>
                <input
                    type="text"
                    name="name"
                    required
                >
            </div>

            <br>

            <div>
                <label>Email</label>
                <br>
                <input
                    type="email"
                    name="email"
                    required
                >
            </div>

            <br>

            <div>
                <label>Password</label>
                <br>
                <input
                    type="password"
                    name="password"
                    required
                >
            </div>

            <br>

            <button type="submit">
                Register
            </button>

        </form>

        <br>

        <a href="{{ url_for('login') }}">
            Already have an account? Login
        </a>

    </div>

</body>
</html>
