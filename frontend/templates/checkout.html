<!DOCTYPE html>
<html>
<head>
    <title>Checkout - Mini Amazon</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <div class="navbar">
        <div>Mini Amazon</div>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Products</a>
            <a href="{{ url_for('view_cart') }}">Cart</a>
            <span>Welcome, {{ session.get("email") }}</span>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </div>

    <div class="container">

        <h2>Checkout</h2>

        <div class="product-card">

            <h3>Order Summary</h3>

            <p>
                Total Amount:
                <strong>₹{{ total }}</strong>
            </p>

            <form method="POST" action="{{ url_for('place_order') }}">

                <button type="submit">
                    Place Order
                </button>

            </form>

        </div>

        <br>

        <a href="{{ url_for('view_cart') }}">
            ← Back to Cart
        </a>

    </div>

</body>
</html>
